# Render Blueprint for the free trial (A-314, docs/34_TRIAL_DEPLOYMENT.md): the API with its jobs, and PostgreSQL 17,
# in Singapore. Not the production layout (docs/15): no separate worker (the free plan has none), migrations at start-up,
# a database that expires 30 days after creation. Test data only.
services:
  - type: web
    name: gymcrm-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-trial.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gymcrm-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SENTRY_ENVIRONMENT
        value: trial
      # The free plan has no worker: the reminders, the email outbox and the backup run inside the API (T-059).
      - key: RUN_JOBS
        value: "true"
      - key: GYM_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: EMAIL_PROVIDER
        value: log
      # Random 256-bit values made by Render once; copy them into the password manager (docs/34 step 6).
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      # Asked for when the Blueprint is created (docs/34 step 3).
      - key: BETTER_AUTH_URL
        sync: false
      - key: FILE_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # The first admin, made at start-up when set; remove both after the first sign-in (docs/34 step 7).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: gymcrm-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: gym
    # Only the API reaches the database, over Render's private network.
    ipAllowList: []
