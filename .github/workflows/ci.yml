name: CI

on:
  pull_request:
  push:
    branches: [main]

# Values below are for CI only; none of them is a real secret.
env:
  DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm
  TEST_DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm_test
  E2E_DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm_e2e
  BETTER_AUTH_SECRET: ci-only-secret-that-protects-nothing-real
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  GYM_TIMEZONE: Asia/Ho_Chi_Minh

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_crm"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create test databases
        run: psql "$DATABASE_URL" -c "CREATE DATABASE fitness_crm_test" -c "CREATE DATABASE fitness_crm_e2e"
      - run: npm ci
      - name: Dependency audit (OWASP A03)
        run: npm run security:audit
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Includes the OWASP security suite (e2e/security) against the production build.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
