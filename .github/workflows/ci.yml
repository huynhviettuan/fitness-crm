name: CI

on:
  pull_request:
  push:
    branches: [main]

# Values below are for CI only; none of them is a real secret.
env:
  DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm
  TEST_DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm_test
  E2E_DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness_crm_e2e
  BETTER_AUTH_SECRET: ci-only-secret-that-protects-nothing-real
  # 32 zero bytes: CI only, protects nothing real.
  FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  BETTER_AUTH_URL: http://localhost:3000
  # The web app reads it when the build collects page data; E2E sets its own port.
  API_URL: http://localhost:4000
  GYM_TIMEZONE: Asia/Ho_Chi_Minh
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_crm"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create test databases
        run: psql "$DATABASE_URL" -c "CREATE DATABASE fitness_crm_test" -c "CREATE DATABASE fitness_crm_e2e"
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (OWASP A03)
        run: pnpm security:audit
      - name: Code style (Prettier)
        run: pnpm format:check
      - run: pnpm turbo run typecheck lint test
      - run: pnpm test:integration
      - name: OpenAPI contract is up to date
        run: pnpm turbo run openapi:check
      - name: Migrations apply cleanly
        run: pnpm db:deploy
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Builds the apps, then runs the smoke cases of the main features (tests tagged @smoke) and the OWASP security
      # suite (the "A01" to "A10" describes of e2e/security, API-only and fast). The full E2E suite runs only when started
      # by hand (full-e2e.yml).
      - name: E2E smoke cases and OWASP security suite
        run: pnpm test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The API's container image (apps/api/Dockerfile; A-312, A-314): built on every push and started the way the free trial
  # starts it (keys checked, migrations, first admin, NODE_ENV=production settings), so a change that breaks the image
  # fails here rather than at a deployment.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: flow_image
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitness -d flow_image"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t flow-api:ci .
      - name: The image has pg_dump 17 (the backups, A-312)
        run: docker run --rm flow-api:ci pg_dump --version | grep "(PostgreSQL) 17"
      - name: Start it as the trial does, then sign in
        # CI-only values; none protects anything real. The database is reached by name, as on a platform.
        run: |
          docker run -d --name api -p 4000:4000 --add-host=db:host-gateway             -e NODE_ENV=production -e RUN_JOBS=false             -e DATABASE_URL=postgresql://fitness:fitness@db:5432/flow_image             -e BETTER_AUTH_SECRET=ci-only-secret-that-protects-nothing-real             -e BETTER_AUTH_URL=https://ci.example.invalid             -e FIELD_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=             -e BACKUP_ENCRYPTION_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=             -e FILE_STORAGE=r2 -e R2_ACCOUNT_ID=ci -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci -e R2_BUCKET=ci             -e SEED_ADMIN_EMAIL=ci-admin@example.invalid -e SEED_ADMIN_PASSWORD=ci-only-password-1234             flow-api:ci sh scripts/start-trial.sh
          for attempt in $(seq 1 60); do
            if curl -fs http://localhost:4000/api/v1/health/ready; then break; fi
            if [ "$attempt" = 60 ]; then docker logs api; exit 1; fi
            sleep 2
          done
          curl -fs http://localhost:4000/api/v1/health
          status=$(curl -s -o sign-in.json -w "%{http_code}" -X POST http://localhost:4000/api/auth/sign-in/email             -H "content-type: application/json" -H "origin: https://ci.example.invalid"             -d '{"email":"ci-admin@example.invalid","password":"ci-only-password-1234"}')
          rm -f sign-in.json
          echo "sign-in: $status"
          test "$status" = 200
      - name: Container log
        if: always()
        run: docker logs api || true
